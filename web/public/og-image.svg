<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0E14"/>

  <!-- Grain texture overlay -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0.05"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="630" fill="#0B0E14" filter="url(#grain)" opacity="0.4"/>

  <!-- Glow accent -->
  <ellipse cx="600" cy="200" rx="400" ry="200" fill="#E9A568" opacity="0.15" filter="blur(80px)"/>

  <!-- Logo square -->
  <rect x="80" y="80" width="80" height="80" rx="12" fill="#E9A568"/>

  <!-- Title -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="#F8FAFC" letter-spacing="-0.03em">
    brewscope
  </text>

  <!-- Subtitle -->
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#94A3B8" letter-spacing="-0.01em">
    A <tspan fill="#E9A568">read-only</tspan> terminal tool for Homebrew on macOS.
  </text>

  <!-- Terminal window -->
  <rect x="80" y="380" width="520" height="200" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <!-- Terminal title bar -->
  <rect x="80" y="380" width="520" height="36" rx="12" fill="#E9A568" fill-opacity="0.1"/>
  <circle cx="105" cy="398" r="6" fill="#E9A568" opacity="0.6"/>
  <circle cx="127" cy="398" r="6" fill="#D97706" opacity="0.4"/>
  <circle cx="149" cy="398" r="6" fill="#F59E0B" opacity="0.4"/>

  <!-- Terminal content -->
  <text x="100" y="448" font-family="'Monaco', 'Courier New', monospace" font-size="16" fill="#E9A568">
    $ brewscope describe
  </text>
  <text x="100" y="480" font-family="'Monaco', 'Courier New', monospace" font-size="14" fill="#94A3B8">
    Formulae: <tspan fill="#E9A568" font-weight="600">247</tspan> installed
  </text>
  <text x="100" y="506" font-family="'Monaco', 'Courier New', monospace" font-size="14" fill="#94A3B8">
    Casks: <tspan fill="#E9A568" font-weight="600">83</tspan> applications
  </text>
  <text x="100" y="540" font-family="'Monaco', 'Courier New', monospace" font-size="13" fill="#10B981">
    ✓ read-only scan complete
  </text>

  <!-- Footer tag -->
  <text x="80" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B">
    rin.contact
  </text>
</svg>
