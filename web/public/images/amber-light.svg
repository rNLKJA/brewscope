<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </radialGradient>

    <!-- Main amber glow -->
    <radialGradient id="amberGlow" cx="45%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#e5a76f" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d48f4f" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#b8763d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f0f0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary copper gradient -->
    <radialGradient id="copperGlow" cx="60%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#d48f4f" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#b8763d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f0f0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid light gradient -->
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5a76f" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#d48f4f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b8763d" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Warm vertical gradient -->
    <linearGradient id="warmShift" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#b8763d" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d48f4f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e5a76f" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glass refraction gradient -->
    <radialGradient id="refract" cx="40%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#e5a76f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d48f4f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f0f0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Turbulence filter for grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="desaturated"/>
      <feComponentTransfer in="desaturated" result="grain">
        <feFuncA type="discrete" tableValues="0 0 0 0 0 0.02"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic" in2="grain"/>
    </filter>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for highlights -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Base amber glow layer -->
  <ellipse cx="360" cy="550" rx="400" ry="350" fill="url(#amberGlow)" opacity="0.7"/>

  <!-- Secondary copper accent -->
  <ellipse cx="480" cy="300" rx="320" ry="280" fill="url(#copperGlow)" opacity="0.6"/>

  <!-- Organic liquid shapes -->
  <path d="M 250 400 Q 320 280, 400 320 T 550 420 Q 580 520, 520 600 T 380 680 Q 280 640, 250 550 T 250 400 Z"
        fill="url(#liquid)" opacity="0.5" filter="url(#glow)"/>

  <path d="M 450 250 Q 520 200, 580 260 T 640 400 Q 620 480, 560 520 T 480 480 Q 440 400, 450 320 T 450 250 Z"
        fill="url(#refract)" opacity="0.6" filter="url(#glow)"/>

  <path d="M 200 600 Q 260 520, 340 560 T 420 700 Q 400 780, 340 820 T 260 780 Q 200 720, 200 640 T 200 600 Z"
        fill="url(#warmShift)" opacity="0.4" filter="url(#glow)"/>

  <!-- Flowing curved shapes for depth -->
  <path d="M 100 300 Q 200 200, 300 280 Q 400 360, 500 320 Q 600 280, 700 360"
        stroke="url(#liquid)" stroke-width="3" fill="none" opacity="0.3" filter="url(#glow)"/>

  <path d="M 150 500 Q 250 420, 350 480 Q 450 540, 550 500 Q 650 460, 750 520"
        stroke="url(#warmShift)" stroke-width="2" fill="none" opacity="0.25" filter="url(#glow)"/>

  <!-- Highlight orbs for glass refraction effect -->
  <circle cx="420" cy="380" r="80" fill="url(#refract)" opacity="0.7" filter="url(#strongGlow)"/>
  <circle cx="520" cy="520" r="60" fill="#e5a76f" opacity="0.4" filter="url(#strongGlow)"/>
  <circle cx="320" cy="620" r="50" fill="#d48f4f" opacity="0.35" filter="url(#strongGlow)"/>

  <!-- Soft organic blob for liquid depth -->
  <ellipse cx="400" cy="480" rx="180" ry="220" fill="url(#amberGlow)" opacity="0.5" filter="url(#glow)"/>

  <!-- Subtle flowing lines -->
  <path d="M 300 200 Q 400 250, 500 220 Q 600 190, 700 240"
        stroke="#e5a76f" stroke-width="1.5" fill="none" opacity="0.2"/>

  <path d="M 100 700 Q 200 650, 300 680 Q 400 710, 500 690 Q 600 670, 700 710"
        stroke="#b8763d" stroke-width="1.5" fill="none" opacity="0.2"/>

  <!-- Top warm gradient overlay -->
  <rect width="800" height="1000" fill="url(#warmShift)" opacity="0.3"/>

  <!-- Grain texture overlay -->
  <rect width="800" height="1000" fill="#0f0f0f" opacity="0.05" filter="url(#grain)"/>
</svg>
